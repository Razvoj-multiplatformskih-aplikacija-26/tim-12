name: radioroom_contract
description: "RadioRoom zajednicki ugovor klijent-servera: ApiError, kodovi gresaka i DTO. Cist Dart paket, bez domena, Flutter-a i dart:io."
version: 0.1.0

# Privatan paket: nikad se ne objavljuje na pub.dev.
publish_to: none

environment:
  sdk: ^3.6.0

# Clan workspace-a: zavisnosti se ne resavaju posebno, vec kroz koren.
resolution: workspace

# Namerno bez zavisnosti: ugovor ne uvozi domen (prevod je u
# `packages/mapping`), Flutter ni `dart:io`. Proverava `purity_test.dart`.

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.6
