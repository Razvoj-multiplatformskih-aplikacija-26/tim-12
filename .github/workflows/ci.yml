name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Analyze + test
    runs-on: ubuntu-latest
    # Baza za testove servera, sa vrednostima iz .env.example (port 5433).
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: radioroom
          POSTGRES_USER: radioroom
          POSTGRES_PASSWORD: radioroom-dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radioroom -d radioroom"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Testovi nad bazom u CI-ju padaju umesto da se tiho preskoce.
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test packages and apps
        run: |
          for dir in packages/*/ apps/*/; do
            if [ -d "${dir}test" ]; then
              echo "::group::${dir}"
              (cd "${dir}" && flutter test)
              echo "::endgroup::"
            fi
          done
