# Jedna komanda podize bazu i server: `cp .env.example .env && docker compose up`.
# Vrednosti dolaze iz .env (Compose ga cita sam).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      # Kontekst je koren repozitorijuma: server treba workspace i packages/.
      context: .
      dockerfile: apps/server/Dockerfile
    env_file: .env
    environment:
      # U mrezi Compose-a baza je servis `db` na svom unutrasnjem portu.
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "8080"
    ports:
      - "${PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
